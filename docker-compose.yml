services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: morphic
      POSTGRES_PASSWORD: morphic
      POSTGRES_DB: morphic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morphic"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local development defaults. In production Redis must listen on the private
  # link only (Tailscale/WireGuard), keep requirepass enabled, and be monitored
  # for `evicted_keys == 0`. See DEPLOYMENT_VPS.md §4 and docs/MULTI_NODE_AUDIT.md.
  redis:
    image: redis:7-alpine
    environment:
      # Password used by `--requirepass` and by the healthcheck below.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-morphic}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --maxmemory 32mb
        --maxmemory-policy allkeys-lru
        --save ""
        --requirepass "$$REDIS_PASSWORD"
    ports:
      # Loopback only: never publish Redis on a public interface.
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://morphic:morphic@postgres:5432/morphic
      # Must match the Redis service password. URL-encode special characters if
      # you override REDIS_PASSWORD (e.g. `p@ss` -> `p%40ss`).
      REDIS_URL: redis://:${REDIS_PASSWORD:-morphic}@redis:6379
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://morphic:morphic@postgres:5432/morphic
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
